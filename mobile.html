<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Manifest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Simple transition for table rows */
        tbody tr {
            transition: background-color 0.2s ease-in-out;
        }
        /* Custom style for input fields in edit mode */
        .edit-input {
            @apply w-full px-1 py-1 border border-slate-300 rounded-md shadow-sm focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition text-[10px];
        }
        /* Custom style for black placeholder in search input */
        #search-input::placeholder {
            color: #64748b; /* Slate 500 */
            opacity: 1; 
        }
        /* Loading Spinner */
        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            position: absolute;
            top: 50%;
            left: 50%;
            margin-top: -25px;
            margin-left: -25px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Modal transitions */
        .modal-enter {
            opacity: 0;
            transform: scale(0.95);
        }
        .modal-enter-active {
            opacity: 1;
            transform: scale(1);
            transition: all 0.2s ease-out;
        }
        .modal-leave-active {
            opacity: 0;
            transform: scale(0.95);
            transition: all 0.2s ease-in;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="loader" class="loader"></div>

    <div id="app-content" class="container mx-auto p-2 sm:p-4 max-w-lg hidden"> 
        
        <!-- Header Row: Title Left, Link Middle, Date Controls Right -->
        <div class="flex flex-row flex-wrap justify-between items-end gap-2 mb-3">
            <!-- Title Section -->
            <div class="flex-shrink-0 mb-1">
                <h1 class="text-sm font-bold text-slate-900 leading-tight">Woodlands RX<br>Delivery Manifest</h1>
            </div>

            <!-- Admin Link -->
            <a href="https://manifest-desktop-764848832553.us-central1.run.app/" class="text-[9px] text-blue-500 hover:text-blue-700 underline mb-1.5 mx-1">
                switch to admin mode
            </a>

            <!-- Controls Section (Dates + Excel) -->
            <div class="flex flex-row gap-1 items-center justify-end flex-grow">
                <!-- Start Date -->
                <input type="date" id="start-date" name="start-date" class="w-[85px] px-1 py-1 border border-slate-300 rounded text-[10px] focus:ring-1 focus:ring-blue-500 bg-white shadow-sm text-slate-600">
                
                <span class="text-slate-400 text-[10px]">-</span>
                
                <!-- End Date -->
                <input type="date" id="end-date" name="end-date" class="w-[85px] px-1 py-1 border border-slate-300 rounded text-[10px] focus:ring-1 focus:ring-blue-500 bg-white shadow-sm text-slate-600">
                
                <!-- Excel Button -->
                <button id="export-btn" class="bg-green-600 text-white p-1.5 rounded shadow-sm hover:bg-green-700 transition flex items-center justify-center" title="Export to Excel">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M10.75 2.75a.75.75 0 00-1.5 0v8.614L6.295 8.235a.75.75 0 10-1.09 1.03l4.25 4.5a.75.75 0 001.09 0l4.25-4.5a.75.75 0 00-1.09-1.03l-2.955 3.129V2.75z" />
                        <path d="M3.5 12.75a.75.75 0 00-1.5 0v2.5A2.75 2.75 0 004.75 18h10.5A2.75 2.75 0 0018 15.25v-2.5a.75.75 0 00-1.5 0v2.5c0 .69-.56 1.25-1.25 1.25H4.75c-.69 0-1.25-.56-1.25-1.25v-2.5z" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Search & Add Row -->
        <div class="flex gap-2 mb-3">
             <div class="relative flex-grow">
                <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-2">
                    <svg class="h-3.5 w-3.5 text-slate-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd"></path>
                    </svg>
                </div>
                <input type="text" id="search-input" class="block w-full rounded border-slate-300 pl-8 py-1.5 text-xs shadow-sm focus:border-blue-500 focus:ring-blue-500 bg-white" placeholder="Search...">
            </div>
             <!-- Toggle Form Button -->
            <button id="toggle-form-btn" class="bg-blue-600 text-white px-3 py-1.5 rounded shadow-sm hover:bg-blue-700 transition text-xs font-semibold flex-shrink-0">
                + Add
            </button>
        </div>

        <!-- Form to add new entry (Hidden by default, toggled via JS) -->
        <div id="form-container" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-4 hidden transition-all duration-300">
            <h2 class="text-sm font-bold mb-3 text-slate-900">Add New Delivery</h2>
            <form id="manifest-form" class="grid grid-cols-1 gap-3">
                <div>
                    <label for="trackingNumber" class="block text-[10px] font-semibold text-slate-600 mb-1">Tracking Number</label>
                    <input type="text" id="trackingNumber" name="trackingNumber" placeholder="e.g., 1Z..." required class="w-full px-2 py-1.5 border border-slate-300 rounded shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs">
                </div>
                <div>
                    <label for="date" class="block text-[10px] font-semibold text-slate-600 mb-1">Date</label>
                    <input type="date" id="date" name="date" required class="w-full px-2 py-1.5 border border-slate-300 rounded shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs">
                </div>
                <div>
                    <label for="patientName" class="block text-[10px] font-semibold text-slate-600 mb-1">Patient Name</label>
                    <input type="text" id="patientName" name="patientName" placeholder="e.g., John Doe" required class="w-full px-2 py-1.5 border border-slate-300 rounded shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs">
                </div>
                <div>
                    <label for="rxNumbers" class="block text-[10px] font-semibold text-slate-600 mb-1">RX #(s)</label>
                    <input type="text" id="rxNumbers" name="rxNumbers" placeholder="e.g., RX1, RX2" required class="w-full px-2 py-1.5 border border-slate-300 rounded shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs">
                     <p class="text-[9px] text-slate-400 mt-0.5">Separate multiple with commas.</p>
                </div>
                <div class="mt-1">
                    <button type="submit" class="w-full bg-blue-600 text-white font-semibold px-4 py-2 rounded shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition text-xs">
                        Add Delivery
                    </button>
                </div>
            </form>
        </div>

        <!-- Manifest Table -->
        <div class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left table-auto">
                    <thead class="bg-slate-50 border-b border-slate-200">
                        <tr>
                            <!-- Compact Headers -->
                            <th class="px-2 py-2 text-[10px] uppercase tracking-wider font-bold text-slate-500 text-left whitespace-nowrap">Track</th>
                            <th class="px-2 py-2 text-[10px] uppercase tracking-wider font-bold text-slate-500 text-left whitespace-nowrap">Date</th>
                            <th class="px-2 py-2 text-[10px] uppercase tracking-wider font-bold text-slate-500 text-left">Patient</th>
                            <th class="px-2 py-2 text-[10px] uppercase tracking-wider font-bold text-slate-500 text-left whitespace-nowrap">RX #</th>
                            <th class="px-2 py-2 text-[10px] uppercase tracking-wider font-bold text-slate-500 text-right hidden">Act</th>
                        </tr>
                    </thead>
                    <tbody id="manifest-table-body" class="divide-y divide-slate-100">
                        <!-- Rows will be dynamically inserted here -->
                    </tbody>
                </table>
            </div>
             <div id="empty-state" class="hidden text-center p-6 text-slate-400 text-xs">
                <p>No entries found.</p>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="delete-confirm-modal" class="fixed inset-0 bg-slate-900 bg-opacity-60 flex items-center justify-center p-4 hidden modal-enter z-50">
        <div class="bg-white rounded-xl shadow-2xl p-5 w-full max-w-xs">
            <div class="text-center">
                 <h3 class="text-sm font-bold text-slate-900">Delete Entry?</h3>
                <p id="modal-text" class="text-xs text-slate-600 mt-2">
                    Are you sure? This cannot be undone.
                </p>
            </div>
            <div class="mt-4 flex gap-2">
                <button id="cancel-delete-btn" type="button" class="w-full inline-flex justify-center rounded border border-slate-300 shadow-sm px-3 py-1.5 bg-white text-xs font-medium text-slate-700 hover:bg-slate-50">
                    Cancel
                </button>
                 <button id="confirm-delete-btn" type="button" class="w-full inline-flex justify-center rounded border border-transparent shadow-sm px-3 py-1.5 bg-red-600 text-xs font-medium text-white hover:bg-red-700">
                    Delete
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase and App Logic -->
    <script type="module">
        // Firebase SDK imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged }
            from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, updateDoc, setLogLevel }
            from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // DOM Elements
        const manifestForm = document.getElementById('manifest-form');
        const formContainer = document.getElementById('form-container');
        const toggleFormBtn = document.getElementById('toggle-form-btn');
        const tableBody = document.getElementById('manifest-table-body');
        const emptyState = document.getElementById('empty-state');
        const exportBtn = document.getElementById('export-btn');
        const loader = document.getElementById('loader');
        const appContent = document.getElementById('app-content');
        const searchInput = document.getElementById('search-input');
        const startDateInput = document.getElementById('start-date');
        const endDateInput = document.getElementById('end-date');
        const deleteModal = document.getElementById('delete-confirm-modal');
        const confirmDeleteBtn = document.getElementById('confirm-delete-btn');
        const cancelDeleteBtn = document.getElementById('cancel-delete-btn');
        const modalText = document.getElementById('modal-text');
        
        // App state
        let localManifestData = [];
        let filteredManifestData = [];
        let editingEntryId = null;
        let entryToDeleteId = null;

        // --- HELPER FUNCTIONS ---
        function getCentralTimeDateString() {
            const now = new Date();
            const options = {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                timeZone: 'America/Chicago'
            };
            const formatter = new Intl.DateTimeFormat('en-US', options);
            const parts = formatter.formatToParts(now);
            const year = parts.find(part => part.type === 'year').value;
            const month = parts.find(part => part.type === 'month').value;
            const day = parts.find(part => part.type === 'day').value;
            return `${year}-${month}-${day}`;
        }

        function formatDateMMDD(dateString) {
            if (!dateString || !dateString.includes('-')) return dateString; 
            try {
                const parts = dateString.split('-'); 
                if (parts.length === 3) {
                    return `${parts[1]}/${parts[2]}`; 
                }
                return dateString; 
            } catch (e) {
                console.warn("Could not parse date:", dateString);
                return dateString; 
            }
        }

        function showAppError(title, message, details = '') {
            loader.style.display = 'none';
            appContent.innerHTML = `<div class="text-center p-8 text-red-600 bg-red-50 rounded-xl border border-red-200">
                                        <h2 class="text-xl font-bold mb-2">${title}</h2>
                                        <p>${message}</p>
                                        <p class="mt-2 text-sm text-slate-600"><strong>Details:</strong> ${details}</p>
                                    </div>`;
            appContent.classList.remove('hidden');
        }

        // New function to fit text to container
        function fitText() {
            const elements = document.querySelectorAll('.fit-text-container');
            elements.forEach(container => {
                const textSpan = container.querySelector('span');
                if(!textSpan) return;

                let size = 10; // Start at default max size (10px)
                const minSize = 7; // Don't go below this
                
                // Reset to max to start calculation
                textSpan.style.fontSize = size + 'px';

                // Reduce size if content is wider than container
                while (textSpan.scrollWidth > container.clientWidth && size > minSize) {
                    size -= 0.5;
                    textSpan.style.fontSize = size + 'px';
                }
            });
        }

        try {
            // --- FIREBASE SETUP ---
            const firebaseConfig = {
              apiKey: "AIzaSyDDmjQNegYPK3V_hG8MIm3Llbtqfp9lu3A",
              authDomain: "delivery-manifest-c3deb.firebaseapp.com",
              projectId: "delivery-manifest-c3deb",
              storageBucket: "delivery-manifest-c3deb.firebasestorage.app",
              messagingSenderId: "510175345991",
              appId: "1:510175345991:web:278310c10426dfe0066062",
              measurementId: "G-SVKEDET5K9"
            };

            const appId = firebaseConfig.projectId;
            
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);
            setLogLevel('debug');

            const manifestCollectionPath = `/artifacts/${appId}/public/data/manifest`;
            const manifestCollection = collection(db, manifestCollectionPath);

            // --- AUTHENTICATION ---
            onAuthStateChanged(auth, user => {
                if (user) {
                    subscribeToManifest(); 
                }
            });

            (async () => {
                const signInTimeout = new Promise((_, reject) =>
                    setTimeout(() => reject(new Error("Authentication timed out after 10 seconds.")), 10000)
                );
                try {
                    await Promise.race([
                        signInAnonymously(auth),
                        signInTimeout
                    ]);
                } catch (error) {
                    console.error("Authentication failed:", error);
                    showAppError("Authentication Error", "Could not sign in to the database.", "Please ensure Anonymous Sign-In is enabled in your Firebase project's Authentication settings and that you have a stable network connection.");
                }
            })();
            
            // --- SEARCH AND FILTER LOGIC ---
            const filterData = () => {
                const searchTerm = searchInput.value.toLowerCase().trim();
                const startDate = startDateInput.value;
                const endDate = endDateInput.value;

                let tempData = [...localManifestData];

                if (searchTerm) {
                    tempData = tempData.filter(entry => {
                        const patientName = (entry.patientName || '').toLowerCase();
                        const rxNumbers = Array.isArray(entry.rxNumbers) ? entry.rxNumbers.join(', ').toLowerCase() : '';
                        const trackingNumber = (entry.trackingNumber || '').toLowerCase();
                        return patientName.includes(searchTerm) || 
                               rxNumbers.includes(searchTerm) || 
                               trackingNumber.includes(searchTerm);
                    });
                }

                if (startDate) {
                    tempData = tempData.filter(entry => entry.date && entry.date >= startDate);
                }

                if (endDate) {
                    tempData = tempData.filter(entry => entry.date && entry.date <= endDate);
                }
                
                filteredManifestData = tempData;
            };

            const handleFilterChange = () => {
                filterData();
                renderTable();
            };

            // --- FIRESTORE REAL-TIME LISTENER ---
            const subscribeToManifest = () => {
                onSnapshot(manifestCollection, (snapshot) => {
                    loader.style.display = 'none'; 
                    appContent.classList.remove('hidden'); 

                    localManifestData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    localManifestData.sort((a, b) => {
                        const dateA = a.date ? new Date(a.date) : new Date(0);
                        const dateB = b.date ? new Date(b.date) : new Date(0);
                        return dateB - dateA;
                    });
                    
                    handleFilterChange();
                }, (error) => {
                    console.error("Error getting manifest data:", error);
                     showAppError("Database Error", "Could not load data from the manifest.", error.message);
                });
            };

            // --- UI RENDERING ---
            const renderTable = () => {
                tableBody.innerHTML = '';
                const searchTerm = searchInput.value.trim();
                const startDate = startDateInput.value;
                const endDate = endDateInput.value;

                if (filteredManifestData.length === 0) {
                    emptyState.classList.remove('hidden');
                    if (searchTerm || startDate || endDate) {
                         emptyState.querySelector('p').textContent = `No results.`;
                    } else {
                        emptyState.querySelector('p').textContent = 'No entries yet.';
                    }
                } else {
                    emptyState.classList.add('hidden');
                    filteredManifestData.forEach(entry => {
                        const row = document.createElement('tr');
                        row.className = 'hover:bg-slate-50 border-b border-slate-100 last:border-b-0'; 
                        const isEditing = entry.id === editingEntryId;

                        if (isEditing) {
                            row.innerHTML = `
                                <td class="px-2 py-2"><input type="text" value="${entry.trackingNumber}" class="edit-input" name="trackingNumber"></td>
                                <td class="px-2 py-2"><input type="date" value="${entry.date}" class="edit-input" name="date"></td>
                                <td class="px-2 py-2"><input type="text" value="${entry.patientName}" class="edit-input" name="patientName"></td>
                                <td class="px-2 py-2"><input type="text" value="${Array.isArray(entry.rxNumbers) ? entry.rxNumbers.join(', ') : ''}" class="edit-input" name="rxNumbers"></td>
                                <td class="px-2 py-2 text-right whitespace-nowrap hidden">
                                    <button data-id="${entry.id}" class="save-btn text-green-600 p-1">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" /></svg>
                                    </button>
                                    <button data-id="${entry.id}" class="cancel-btn text-slate-400 p-1">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                                    </button>
                                </td>
                            `;
                        } else {
                            // Tracking: whitespace-nowrap and very small font (text-[9px]) to fit on one line.
                            // Patient Name: wrapped in fit-text-container to allow JS to shrink it. max-w-[110px] triggers the shrink.
                            row.innerHTML = `
                                <td class="px-2 py-1.5 align-middle whitespace-nowrap">
                                    ${entry.trackingNumber ?
                                        `<a href="https://www.ups.com/track?tracknum=${entry.trackingNumber}" target="_blank" class="text-blue-600 hover:text-blue-800 hover:underline font-mono text-[9px]" title="Track">
                                            ${entry.trackingNumber}
                                        </a>` :
                                        '<span class="text-slate-300 text-[9px]">-</span>'
                                    }
                                </td>
                                <td class="px-2 py-1.5 text-[10px] text-slate-600 whitespace-nowrap align-middle">${formatDateMMDD(entry.date)}</td>
                                <td class="px-2 py-1.5 align-middle">
                                    <div class="fit-text-container max-w-[110px] whitespace-nowrap overflow-hidden">
                                        <span class="text-[10px] font-semibold text-slate-800 block">${entry.patientName}</span>
                                    </div>
                                </td>
                                <td class="px-2 py-1.5 text-[10px] text-slate-600 align-middle whitespace-nowrap">
                                    ${Array.isArray(entry.rxNumbers) ? 
                                        entry.rxNumbers.join(', ') : 
                                        ''
                                    }
                                </td>
                                <td class="px-2 py-1.5 text-right whitespace-nowrap hidden align-middle">
                                    <button data-id="${entry.id}" class="edit-btn text-slate-400 hover:text-blue-600 p-1">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor"><path d="M17.414 2.586a2 2 0 00-2.828 0L7 10.172V13h2.828l7.586-7.586a2 2 0 000-2.828z" /><path fill-rule="evenodd" d="M2 6a2 2 0 012-2h4a1 1 0 010 2H4v10h10v-4a1 1 0 112 0v4a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" clip-rule="evenodd" /></svg>
                                    </button>
                                    <button data-id="${entry.id}" class="delete-btn text-slate-400 hover:text-red-600 p-1">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm4 0a1 1 0 012 0v6a1 1 0 11-2 0V8z" clip-rule="evenodd" /></svg>
                                    </button>
                                </td>
                            `;
                        }
                        tableBody.appendChild(row);
                    });
                    
                    // Call the text fitter after rendering the table
                    requestAnimationFrame(fitText);
                }
            };

            // --- EVENT HANDLERS ---
            
            // Toggle form visibility
            toggleFormBtn.addEventListener('click', () => {
                formContainer.classList.toggle('hidden');
                // Optional: Focus the input if opening
                if (!formContainer.classList.contains('hidden')) {
                    document.getElementById('trackingNumber').focus();
                }
            });

            const addEntry = async (e) => {
                e.preventDefault();
                const rxNumbersRaw = manifestForm.querySelector('#rxNumbers').value.trim();
                const newEntry = {
                    date: manifestForm.querySelector('#date').value,
                    patientName: manifestForm.querySelector('#patientName').value.trim(),
                    rxNumbers: rxNumbersRaw.split(',').map(rx => rx.trim()).filter(rx => rx),
                    trackingNumber: manifestForm.querySelector('#trackingNumber').value.trim(),
                };
                try {
                    await addDoc(manifestCollection, newEntry);
                    manifestForm.reset();
                    document.getElementById('date').value = getCentralTimeDateString();
                    // Close form after submit to save space? Optional. 
                    // formContainer.classList.add('hidden'); 
                    alert("Entry Added!"); // Simple feedback since form might stay open
                } catch (error) {
                    console.error("Error adding document: ", error);
                }
            };

            const handleTableClick = (e) => {
                // Check if we clicked a link directly
                if (e.target.tagName === 'A') return;

                const target = e.target.closest('button');
                if (!target) return;

                const id = target.dataset.id;
                
                if (target.classList.contains('delete-btn')) {
                    entryToDeleteId = id;
                    const entry = localManifestData.find(e => e.id === id);
                    if (entry) {
                        modalText.textContent = `Delete ${entry.patientName} (${formatDateMMDD(entry.date)})?`;
                    }
                    deleteModal.classList.remove('hidden');
                    deleteModal.classList.add('modal-enter-active');

                } else if (target.classList.contains('edit-btn')) {
                    editingEntryId = id;
                    renderTable();
                } else if (target.classList.contains('cancel-btn')) {
                    editingEntryId = null;
                    renderTable();
                } else if (target.classList.contains('save-btn')) {
                    const row = target.closest('tr');
                    const rxNumbersRaw = row.querySelector('input[name="rxNumbers"]').value.trim();
                    const updatedData = {
                        date: row.querySelector('input[name="date"]').value,
                        patientName: row.querySelector('input[name="patientName"]').value,
                        rxNumbers: rxNumbersRaw.split(',').map(rx => rx.trim()).filter(rx => rx),
                        trackingNumber: row.querySelector('input[name="trackingNumber"]').value,
                    };
                    updateDoc(doc(db, manifestCollectionPath, id), updatedData)
                        .then(() => { editingEntryId = null; })
                        .catch(error => console.error("Error updating document: ", error));
                }
            };

            const exportToCsv = () => {
                const headers = ['Tracking Number', 'Date', 'Patient Name', 'RX #(s)'];
                const escapeCsvCell = (cell) => `"${String(cell).replace(/"/g, '""')}"`;
                
                const rows = filteredManifestData.map(entry => 
                    [
                        entry.trackingNumber,
                        entry.date, 
                        escapeCsvCell(entry.patientName), 
                        escapeCsvCell(Array.isArray(entry.rxNumbers) ? entry.rxNumbers.join(', ') : '')
                    ].join(',')
                );
                
                let csvContent = headers.join(',') + "\n" + rows.join("\n");

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8,' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", `delivery_manifest_${new Date().toISOString().split('T')[0]}.csv`);
                link.style.visibility = 'hidden';
                document.body.appendChild(link); 
                link.click();
                document.body.removeChild(link);
            };

            const closeDeleteModal = () => {
                entryToDeleteId = null;
                deleteModal.classList.add('hidden');
                deleteModal.classList.remove('modal-enter-active');
            };

            const handleDeleteConfirmation = async () => {
                if (entryToDeleteId) {
                    try {
                        await deleteDoc(doc(db, manifestCollectionPath, entryToDeleteId));
                    } catch (error) {
                        console.error("Error deleting document: ", error);
                    } finally {
                        closeDeleteModal();
                    }
                }
            };

            // Call fitText on resize as well, in case screen rotation/resize happens
            window.addEventListener('resize', () => {
                 requestAnimationFrame(fitText);
            });

            manifestForm.addEventListener('submit', addEntry);
            tableBody.addEventListener('click', handleTableClick);
            exportBtn.addEventListener('click', exportToCsv);
            searchInput.addEventListener('input', handleFilterChange);
            startDateInput.addEventListener('change', handleFilterChange);
            endDateInput.addEventListener('change', handleFilterChange);
            confirmDeleteBtn.addEventListener('click', handleDeleteConfirmation);
            cancelDeleteBtn.addEventListener('click', closeDeleteModal);
            deleteModal.addEventListener('click', (e) => {
                if (e.target === deleteModal) {
                    closeDeleteModal();
                }
            });

            // Set default date for the hidden form's date input
            const formDateInput = document.getElementById('date');
            if(formDateInput) {
                formDateInput.value = getCentralTimeDateString();
            }
        
        } catch (error) {
            console.error("Failed to initialize the application:", error);
            showAppError("Application Error", "A critical error occurred while starting the application.", error.message);
        }
    </script>
</body>
</html>
